name: Main launcher APK with scroll fix

on:
  workflow_dispatch:
  push:
    branches: [scroll-main-build]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # Keep the test-only key across builds so a later test APK can update the first.
      # It is NOT a production signing key; never use it for store releases.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: main-build-signing-v1
      - name: Install SDK and native build dependencies
        shell: bash
        run: |
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          sdkmanager "platforms;android-37.0" "ndk;$ndk" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y libarchive-tools gawk
      - name: Package the Linux runtime (required for working terminals)
        run: ./scripts/fetch-proot.sh
      - name: Test
        run: ./gradlew :owl:test :app:testFossDebugUnitTest :owl:owlJar
      - name: Build
        run: ./gradlew :app:assembleFossDebug
      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-main-scrollfix
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-scroll-test-reports
          path: |
            app/build/reports/
            owl/build/reports/
          if-no-files-found: ignore
